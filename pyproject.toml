[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairscape-models"
version = "1.2.2"
description = "Fairscape pydantic models"
readme = "README.md"
authors = [
    {name = "Justin Niestroy", email = "jniestroy@gmail.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.5",
    "pymongo",
    "typing",
    "mongomock",
    "pyyaml>=6.0.3",
]
requires-python = ">=3.8"

[project.optional-dependencies]
# Per-format schema inference/validation deps, imported lazily by the
# fairscape_models.schema.* infer/validate methods. The base package needs none.
schema-tabular = ["frictionless>=5.0,<6.0", "pyarrow>=14", "pandas"]
schema-hdf5 = ["h5py"]
schema-signal = ["wfdb"]
schema-image = ["pydicom"]
schema-infer = [
    "frictionless>=5.0,<6.0",
    "pyarrow>=14",
    "pandas",
    "h5py",
    "wfdb",
    "pydicom",
]

[project.urls]
"Homepage" = "https://github.com/fairscape/fairscape_models"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"fairscape_models.schema" = ["reference_tables/*.csv"]

[tool.coverage.run]
omit = [
    "fairscape_models/conversion/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
