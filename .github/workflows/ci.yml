name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  codemeta-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check codemeta.json version matches pyproject.toml
      run: |
        python3 -c "
        import json, tomllib
        cm = json.load(open('codemeta.json'))['version']
        py = tomllib.load(open('pyproject.toml','rb'))['project']['version']
        assert cm == py, f'codemeta.json version {cm} != pyproject {py}'
        "

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov flake8 numpy
        pip install -r requirements.txt
        # schema-infer extra (frictionless/pyarrow/pandas/h5py/wfdb/pydicom) so the
        # schema infer/validate tests actually run instead of importorskip-skipping,
        # which is what keeps coverage above the threshold below.
        pip install -e ".[schema-infer]"

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests and check coverage
      run: |
        pytest --cov=fairscape_models --cov-report=term-missing --cov-fail-under=95